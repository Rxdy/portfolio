services:
  web:
    image: ghcr.io/rxdy/portfolio-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: portfolio-prod
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.rule=Host(`rxdy.fr`) || Host(`www.rxdy.fr`)
      - traefik.http.routers.portfolio.tls.certresolver=leresolver
      - traefik.http.services.portfolio.loadbalancer.server.port=80
    networks:
      - default
      - web

  backend:
    image: ghcr.io/rxdy/portfolio-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: portfolio-backend-prod
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - PORT=3000
      - ALLOWED_ORIGIN=https://rxdy.fr
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CONTACT_TO=${CONTACT_TO:-rudyalvs@gmail.com}
    networks:
      - default

networks:
  default: {}
  web:
    external: true

