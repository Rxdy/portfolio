services:
  web:
    image: ghcr.io/rxdy/portfolio-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: portfolio-prod
    ports:
      - "8099:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: ghcr.io/rxdy/portfolio-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: portfolio-backend-prod
    restart: unless-stopped
    environment:
      - PORT=3000
      - ALLOWED_ORIGIN=https://rxdy.fr
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CONTACT_TO=${CONTACT_TO:-rudyalvs@gmail.com}
