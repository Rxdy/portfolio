server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets fingerprintés par Vite : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toute URL inconnue renvoie index.html
    # (indispensable pour que /competences, /mon-parcours… fonctionnent au refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
