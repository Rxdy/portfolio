<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      content="Rudy Alves — développeur web passionné par la création de projets (Vue, TypeScript, Node)."
    />

    <!-- Open Graph (aperçu lors des partages : LinkedIn, WhatsApp, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rxdy.fr" />
    <meta property="og:title" content="Rudy Alves — Développeur web" />
    <meta
      property="og:description"
      content="Développeur web passionné par la création de projets — Vue, TypeScript, Node, et une exigence de qualité (tests, CI/CD, archi)."
    />
    <meta property="og:url" content="https://rxdy.fr/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://rxdy.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rudy Alves — Développeur web · rxdy.fr" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rudy Alves — Développeur web" />
    <meta
      name="twitter:description"
      content="Développeur web passionné par la création de projets — Vue, TypeScript, Node."
    />
    <meta name="twitter:image" content="https://rxdy.fr/og-image.png" />
    <script>
      // Applique le thème avant le rendu pour éviter tout clignotement
      ;(function () {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
