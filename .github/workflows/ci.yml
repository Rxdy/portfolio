name: CI

on:
  # Tests : sur chaque PR, et appelés par images.yml avant le build qui suit une fusion dans dev
  pull_request:
  workflow_call:

jobs:
  quality-frontend:
    name: Frontend — Qualité (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run type-check

      - name: Tests + couverture (seuils à 100 %)
        run: npm run coverage

      - name: Build de production
        run: npm run build

  quality-backend:
    name: Backend — Qualité (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run type-check

      - name: Tests + couverture (seuils à 100 %)
        run: npm run coverage

      - name: Build de production
        run: npm run build
